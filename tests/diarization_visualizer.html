<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Lane Audio Diarization Sync Visualizer</title>
    <style>
        /* Global Box-Sizing Reset to prevent layout calculation drifts */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --grid-line: rgba(51, 65, 85, 0.4);
            /* Strict Shared Constraint to guarantee layout alignment */
            --sidebar-width: 150px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        /* Control Panel Styles */
        .controls {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.15);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: inline-block;
        }
        .btn:hover { background-color: #2563eb; }

        audio {
            flex-grow: 1;
            min-width: 250px;
            height: 40px;
        }

        /* Legend Styles */
        .legend {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.2);
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        /* Multi-Lane Layout Structure */
        .timeline-wrapper {
            position: relative;
            margin: 2.5rem 0;
            background-color: #0b0f19;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none; /* Hidden until data loads */
        }

        .lanes-container {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Single Speaker Track Row */
        .lane-row {
            display: flex;
            height: 60px;
            border-bottom: 1px solid var(--grid-line);
            position: relative;
            align-items: center;
        }

        .lane-label-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            height: 100%;
            background-color: rgba(30, 41, 59, 0.8);
            border-right: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            padding-left: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 15;
            color: var(--text-main);
        }

        /* Active timeline coordinate mapping space */
        .lane-timeline-canvas {
            position: relative;
            flex-grow: 1;
            height: 100%;
        }

        /* Absolute Positioned Data Blocks */
        .segment {
            position: absolute;
            height: 70%;
            top: 15%;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .segment:hover {
            filter: brightness(1.2);
            transform: scaleY(1.08);
            z-index: 10;
        }

        .segment-label {
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
            width: 100%;
            text-align: center;
        }

        .segment-time {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.9);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Time Axis Row Layout */
        .time-axis {
            position: relative;
            height: 28px;
            display: flex;
            background: rgba(0,0,0,0.2);
        }

        .axis-spacer {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            border-right: 2px solid transparent;
        }

        .axis-ticks-container {
            position: relative;
            flex-grow: 1;
            height: 100%;
        }

        .time-tick {
            position: absolute;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-muted);
            top: 6px;
        }

        .time-tick::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            width: 1px;
            height: 4px;
            background-color: var(--border-color);
        }

        /* Details Panel */
        .details-panel {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            min-height: 50px;
        }

        /* Playhead Navigation Track Area Wrapper */
        .playhead-track-overlay {
            position: absolute;
            top: 0;
            bottom: 28px; /* Terminates cleanly exactly above the x-axis tick section */
            left: var(--sidebar-width);
            right: 0;
            pointer-events: none;
            z-index: 25;
        }

        /* Visual Track Indicator Line */
        #play-head {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            left: 0%; /* Initial baseline position */
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Lane Audio Diarization Visualizer</h2>

    <div class="controls">
        <div class="input-group">
            <label>1. Analysis Data</label>
            <div class="file-input-wrapper">
                <button class="btn">Load JSON</button>
                <input type="file" id="jsonPicker" accept=".json" />
            </div>
        </div>

        <div class="input-group">
            <label>2. Source Recording</label>
            <div class="file-input-wrapper">
                <button class="btn" style="background-color: #10b981;">Load WAV</button>
                <input type="file" id="audioPicker" accept="audio/wav, audio/*" />
            </div>
        </div>

        <div class="input-group" style="flex-grow: 1; padding-top: 1.1rem;">
            <audio id="audioPlayer" controls style="display: none; width: 100%;"></audio>
        </div>
    </div>

    <div class="legend" id="legendContainer" style="display: none;"></div>

    <div class="timeline-wrapper" id="visualizerWrapper">
        <div class="playhead-track-overlay">
            <div id="play-head"></div>
        </div>

        <div class="lanes-container" id="lanesContainer"></div>

        <div class="time-axis">
            <div class="axis-spacer"></div>
            <div class="axis-ticks-container" id="axisTicksContainer"></div>
        </div>
    </div>

    <div class="details-panel" id="detailsPanel">
        <span style="color: var(--text-muted);">Please load both your structural JSON data and corresponding WAV file to start analyzing the track layers.</span>
    </div>
</div>

<script>
    let activeData = null;
    const audioPlayer = document.getElementById('audioPlayer');
    const playHead = document.getElementById('play-head');

    const colorPalette = {
        "0": "#475569",    // Noise/Silence (Muted Grey)
        "-1": "#10b981",   // Speaker -1 (Emerald Green)
        "-2": "#3b82f6",   // Speaker -2 (Blue)
        "-3": "#f59e0b",   // Speaker -3 (Amber)
        "-4": "#ec4899",   // Speaker -4 (Pink)
        "default": "#8b5cf6"
    };

    function getSpeakerLabel(id) {
        if (id === 0) return "Noise / Silence";
        return `Speaker ${id}`;
    }

    // 1. Handle JSON File Input
    document.getElementById('jsonPicker').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsedJson = JSON.parse(e.target.result);
                if (!parsedJson.segments || !Array.isArray(parsedJson.segments)) {
                    throw new Error("Invalid structure: Missing root 'segments' array.");
                }
                activeData = parsedJson;
                renderMultiLaneVisualizer(activeData);
                checkSyncStatus();
            } catch (err) {
                alert(`Error parsing JSON: ${err.message}`);
            }
        };
        reader.readAsText(file);
    });

    // 2. Handle WAV File Input
    document.getElementById('audioPicker').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const objectUrl = URL.createObjectURL(file);
        audioPlayer.src = objectUrl;
        audioPlayer.style.display = 'block';

        checkSyncStatus();
    });

    function checkSyncStatus() {
        if (activeData && audioPlayer.src) {
            document.getElementById('detailsPanel').innerHTML = `
                <span style="color: #10b981; font-weight: bold;">
                    🚀 Sync Active! Tracks are isolated below. Play the audio console to track active timelines.
                </span>`;
        }
    }

    // 3. Absolute Visual Time Update Sync
    audioPlayer.addEventListener('timeupdate', function() {
        if (!activeData) return;

        const totalDuration = activeData.segments[activeData.segments.length - 1].end_time;
        const currentTime = audioPlayer.currentTime;

        // Calculate raw percentage progress across the isolated overlay track space
        const pctPosition = (currentTime / totalDuration) * 100;

        if (pctPosition <= 100) {
            playHead.style.left = `${pctPosition}%`;
        }
    });

    function jumpToTime(seconds) {
        if (audioPlayer.src) {
            audioPlayer.currentTime = seconds;
        }
    }

    function renderMultiLaneVisualizer(data) {
        const lanesContainer = document.getElementById('lanesContainer');
        const legend = document.getElementById('legendContainer');
        const ticksContainer = document.getElementById('axisTicksContainer');
        const wrapper = document.getElementById('visualizerWrapper');

        lanesContainer.innerHTML = '';
        legend.innerHTML = '';
        ticksContainer.innerHTML = '';

        wrapper.style.display = 'block';
        legend.style.display = 'flex';

        const totalDuration = data.segments[data.segments.length - 1].end_time;

        const uniqueUserIds = [...new Set(data.segments.map(s => s.user_id))];
        uniqueUserIds.sort((a, b) => b - a);

        const laneCanvases = {};

        uniqueUserIds.forEach(id => {
            const color = colorPalette[id] || colorPalette.default;

            legend.innerHTML += `
                <div class="legend-item">
                    <div class="color-box" style="background-color: ${color}"></div>
                    <span>${getSpeakerLabel(id)}</span>
                </div>
            `;

            const rowEl = document.createElement('div');
            rowEl.className = 'lane-row';

            const labelSidebar = document.createElement('div');
            labelSidebar.className = 'lane-label-sidebar';
            labelSidebar.innerText = getSpeakerLabel(id);

            const timelineCanvas = document.createElement('div');
            timelineCanvas.className = 'lane-timeline-canvas';

            rowEl.appendChild(labelSidebar);
            rowEl.appendChild(timelineCanvas);
            lanesContainer.appendChild(rowEl);

            laneCanvases[id] = timelineCanvas;
        });

        // Plot segments using percentage layout values
        data.segments.forEach((seg, index) => {
            const duration = seg.end_time - seg.start_time;
            const leftPct = (seg.start_time / totalDuration) * 100;
            const widthPct = (duration / totalDuration) * 100;
            const color = colorPalette[seg.user_id] || colorPalette.default;

            const segmentEl = document.createElement('div');
            segmentEl.className = 'segment';
            segmentEl.style.left = `${leftPct}%`;
            segmentEl.style.width = `${widthPct}%`;
            segmentEl.style.backgroundColor = color;

            segmentEl.innerHTML = `
                <div class="segment-label">${seg.type === 'noise' ? '💤 Noise' : '🎙️ Active'}</div>
                <div class="segment-time">${duration.toFixed(1)}s</div>
            `;

            segmentEl.addEventListener('mouseenter', () => {
                document.getElementById('detailsPanel').innerHTML = `
                    <strong>Lane Assigned:</strong> ${getSpeakerLabel(seg.user_id)} |
                    <strong>Segment Order Index:</strong> #${index + 1} |
                    <strong>Timestamp Window:</strong> ${seg.start_time.toFixed(2)}s - ${seg.end_time.toFixed(2)}s
                    (${duration.toFixed(2)}s duration)
                `;
            });

            segmentEl.addEventListener('click', () => {
                jumpToTime(seg.start_time);
            });

            if (laneCanvases[seg.user_id]) {
                laneCanvases[seg.user_id].appendChild(segmentEl);
            }
        });

        // Render Scale Axis Ticks
        const step = totalDuration > 120 ? 20 : (totalDuration > 60 ? 10 : 5);
        for(let i = 0; i <= totalDuration; i += step) {
            const pctPos = (i / totalDuration) * 100;
            const tick = document.createElement('div');
            tick.className = 'time-tick';
            tick.style.left = `${pctPos}%`;
            tick.innerText = `${i}s`;
            ticksContainer.appendChild(tick);
        }
    }
</script>

</body>
</html>

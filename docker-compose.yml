services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    env_file: "./.env"
    volumes:
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_image_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    env_file: "./.env"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_image_network
    restart: unless-stopped

  file_storage:
    image: quay.io/minio/minio
    container_name: file_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai_image_network

  api:
    image: image_object_base:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: api
    env_file: "./.env"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    working_dir: /app
    volumes:
      - .:/app
      - api_venv:/app/.venv  # manage one uv env so we dont copy local one into docker
    ports:
      - "8083:8000"
#    depends_on:
#      postgres:
#        condition: service_healthy
#      rabbitmq:
#        condition: service_healthy
#    command: >
#      sh -c "uv run alembic upgrade head &&
#             uv run uvicorn src.workers.api_worker:app --host 0.0.0.0 --workers 2 --port 8000"
    command: >
      sh -c "uv run uvicorn src.workers.api_worker:app --host 0.0.0.0 --workers 2 --port 8000"
    networks:
      - ai_image_network

  alembic_gen:
    image: image_object_base:latest # name the image so it doesn't rebuild every time
    env_file: "./.env"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_image_network
    profiles:
      - tools

  broker_worker:
    image: image_object_base:latest
    env_file: "./.env"
    container_name: broker_worker
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_image_network
    volumes:
      - .:/app
      - ./logs:/logs
      - api_venv:/app/.venv
    command: uv run python -m src.workers.broker_worker
    stop_grace_period: 30s
    restart: unless-stopped

  callback_worker:
    image: image_object_base:latest
    env_file: "./.env"
    container_name: callback_worker
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Required for Linux host-to-container routing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_image_network
    volumes:
      - .:/app
      - ./logs:/logs
      - api_venv:/app/.venv
    command: uv run python -m src.workers.callback_worker
    stop_grace_period: 30s
    restart: unless-stopped

  image_worker:
    image: image_object_base:latest
    container_name: image_worker
    working_dir: /app
    env_file: "./.env"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_image_network
    volumes:
      - .:/app
      - ./logs:/logs
      - api_venv:/app/.venv
    command: uv run python -m src.workers.image_worker
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
  api_venv:

networks:
  ai_image_network:
    driver: bridge
